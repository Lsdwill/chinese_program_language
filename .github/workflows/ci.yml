name: 华言持续集成

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go vet ./...
      - shell: bash
        run: bash scripts/check-core-coverage.sh 85
      - run: go build ./cmd/huayan
      - run: go build -o huayan ./cmd/huayan
        if: runner.os != 'Windows'
      - run: go build -o huayan.exe ./cmd/huayan
        if: runner.os == 'Windows'
      - shell: bash
        run: |
          bin=./huayan
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin=./huayan.exe; fi
          bash scripts/check-conformance.sh "$bin"
      - shell: bash
        run: |
          bin=./huayan
          if [[ "$RUNNER_OS" == "Windows" ]]; then bin=./huayan.exe; fi
          bash scripts/test-library.sh "$bin"
      - run: go test ./... -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out
